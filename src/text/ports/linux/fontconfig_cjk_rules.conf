<fontconfig>
  <description>Locale-specific Noto Sans CJK fallback for sans-serif</description>
  <!--
  Fontconfig appends environment languages before evaluating pattern rules.
  For an explicit request, keep its first lang value (the complete FcLangSet)
  before any system/user aliases run. Otherwise a distro rule may promote the
  environment's CJK family to strong binding and override the requested locale.
  Requests without an explicit language retain all normal environment defaults.
  Later system/user edits remain authoritative; family preferences stay weak.
  -->
  <match target="pattern">
    <test name="skity_explicit_language"><bool>true</bool></test>
    <edit name="lang" mode="assign_replace" binding="strong">
      <name>lang</name>
    </edit>
    <edit name="skity_explicit_language" mode="delete_all"/>
  </match>

  <!-- Supply a fallback generic without replacing an explicit family. -->
  <match target="pattern">
    <test name="family" qual="all" compare="not_eq"><string>sans-serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>serif</string></test>
    <test name="family" qual="all" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last" binding="weak">
      <string>sans-serif</string>
    </edit>
  </match>

  <!--
  Match the first language value after explicit-language normalization.
  qual="first" does not impose ordering within a multi-language FcLangSet.
  Insert before the matched generic with weak binding to preserve family order.
  Language and character coverage still participate in Fontconfig scoring.
  Strong explicit families remain preferred. Do not force a TTC index.
  Pass one effective locale per text run; a multi-language FcLangSet is unordered.
  -->
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>zh-CN</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>zh-Hans</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>zh-TW</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>zh-Hant</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" qual="first" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
</fontconfig>
