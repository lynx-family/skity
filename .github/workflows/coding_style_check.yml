name: Coding Style Check

on:
    pull_request:
        branches:
            - main

jobs:
    cpplint_check:
        runs-on: lynx-ubuntu-22.04-medium
        timeout-minutes: 30
        steps:
          - name: Python Setup
            uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
            with:
                python-version: '3.13'
          - name: Download Source
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            with:
                fetch-depth: 10
                ref: ${{ github.event.pull_request.head.sha }}
          - name: Sync Dependencies
            uses: ./.github/actions/sync-deps
          - name: cpplint check
            run: |
                python tools/cpplint_check.py ${{ github.event.pull_request.base.sha }}
          - name: coding style check
            run: |
                python tools/code_format_check.py ${{ github.event.pull_request.base.sha }} --clang-format-path ./buildtools/llvm/bin/clang-format
