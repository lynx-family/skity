name: Size Report

# Workflow B: post/update the PR comment from the size-result artifact
# produced by Size Check. Triggered via workflow_run so it runs in the
# default-branch context with a full-permission token, which is what keeps
# commenting working for PRs opened from fork repositories (where the
# pull_request workflow itself only gets a read-only token).
#
# NOTE: this workflow must exist on the default branch to fire at all, and
# the copy that runs is always the default-branch one.

on:
    workflow_run:
        workflows:
            - Size Check
        types:
            - completed

permissions:
    pull-requests: write

jobs:
    comment:
        name: comment size report
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ${{ vars.SIZE_RUNNER || 'lynx-ubuntu-22.04-medium' }}
        timeout-minutes: 10
        steps:
            - name: Download Size Result
              uses: actions/download-artifact@v4
              with:
                  name: size-result
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path: size-result
            # only parses data files from the artifact; never executes
            # anything out of it. The pull request is resolved from the
            # trusted workflow_run head sha (event payload), never from
            # artifact data, and all dynamic values reach the script via
            # env so they can never be evaluated as script source.
            - name: Comment On Pull Request
              uses: actions/github-script@v7
              env:
                  REPORT_FILE: size-result/comment.md
              with:
                  script: |
                      const fs = require('fs');
                      let body;
                      try {
                          body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
                      } catch (e) {
                          core.info('no report found in artifact, skipping');
                          return;
                      }
                      const headSha = context.payload.workflow_run.head_sha;
                      const headBranch = context.payload.workflow_run.head_branch;
                      const headRepo = context.payload.workflow_run.head_repository || {};
                      // resolve the PR from trusted event data only:
                      // pulls.list with head filter works for both fork
                      // PRs (user:branch) and same-repo PRs (branch),
                      // unlike listPullRequestsAssociatedWithCommit which
                      // misses fork commits
                      let headFilter = headBranch;
                      const baseFullName = `${context.repo.owner}/${context.repo.repo}`;
                      if (headRepo.full_name && headRepo.full_name !== baseFullName) {
                          // minimal-repository payloads carry owner.login,
                          // not a top-level login field
                          const headLogin = (headRepo.owner && headRepo.owner.login) ||
                              headRepo.full_name.split('/')[0];
                          headFilter = `${headLogin}:${headBranch}`;
                      }
                      let pr = null;
                      if (headFilter) {
                          const { data: headPrs } = await github.rest.pulls.list({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              head: headFilter,
                              state: 'open',
                              per_page: 10,
                          });
                          pr = headPrs.find((p) => p.head.sha === headSha) || null;
                      }
                      if (!pr) {
                          // fallback for same-repo associations
                          const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              commit_sha: headSha,
                          });
                          pr = prs.find((p) => p.state === 'open' && p.head.sha === headSha) || null;
                      }
                      if (!pr) {
                          core.info(`no open pull request for ${headFilter || headSha}, skipping`);
                          return;
                      }
                      const marker = '<!-- skity-size-report -->';
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: pr.number,
                          per_page: 100,
                      });
                      const previous = comments.find((c) => c.body && c.body.includes(marker));
                      if (previous) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: previous.id,
                              body,
                          });
                          core.info(`updated comment ${previous.html_url}`);
                      } else {
                          const { data: created } = await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: pr.number,
                              body,
                          });
                          core.info(`created comment ${created.html_url}`);
                      }
