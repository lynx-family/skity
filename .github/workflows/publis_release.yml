name: publish release

permissions:
  contents: write

on:
    release:
        types: [created]
    workflow_dispatch:

jobs:
    build-android-aar:
        runs-on: lynx-ubuntu-22.04-medium
        steps:
          - name: Python Setup
            uses: actions/setup-python@v5
            with:
                python-version: '3.13'
          - uses: actions/setup-java@v4
            with:
              distribution: 'jetbrains'
              java-version: '21'
          - name: Download Source
            uses: actions/checkout@v4.2.2
          - name: Sync Dependencies
            uses: ./.github/actions/sync-deps
            with:
              target: module,ci
          - name: Android Build Check
            uses: ./.github/actions/pack-android-aar
          - name: Build Android Release Artifact
            run: |
              TAG_NAME=${{ github.event.release.tag_name }}
              VERSION=${TAG_NAME#v}
              cd platform/android
              ./gradlew publish \
              -Pversion=${VERSION} \
              -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
              -Psigning.password=${{ secrets.SIGNING_PASSWORD }} \
              -Psigning.secretKey=${{ secrets.SIGNING_SECRET_KEY }}
              ./gradlew zipArtifacts -Pversion=${VERSION} getArtifactList
              pushd build/
              artifact_list=$(<artifact-list)
              echo "artifact_list=$artifact_list" >> $GITHUB_OUTPUT;
              popd
            id: build_artifact
          - name: Publish artifact to maven
            uses: lynx-infra/maven-publish-action@8f547cf037360752cc9f195d04c2d8f327fee434
            with:
              portal_api_token: ${{ secrets.PORTAL_API_TOKEN }}
              artifact_path_list: ${{ steps.build_artifact.outputs.artifact_list }}

    build-xcframework:
        runs-on: macos-14
        steps:
          - name: Download Source
            uses: actions/checkout@v4.2.2
          - name: Sync Dependencies
            run: |
                ./tools/hab sync -f
          - name: Setup ruby
            uses: ruby/setup-ruby@v1
            with:
                ruby-version: '3.0'
                bundler-cache: true
                working-directory: platform/darwin
          - name: Generate XCFramework
            run: |
                TAG_NAME=${{ github.event.release.tag_name }}
                VERSION=${TAG_NAME#v}
                PODSPEC_URL="https://github.com/lynx-family/skity/releases/download/${TAG_NAME}/skity.framework-${TAG_NAME}.zip"
                echo "podspec url: $PODSPEC_URL"
                echo "version string: $VERSION"
                echo "VERSION=$VERSION" >> $GITHUB_ENV
                echo "PODSPEC_URL=$PODSPEC_URL" >> $GITHUB_ENV
                tools/pack_skity_framework.py $VERSION
          - name: Copy XCFramework
            run: |
                mkdir -p out/release
                cp -r out/skity.framework.zip out/release/skity.framework-${{ github.event.release.tag_name }}.zip
          - name: Generate Podspec
            run: |
                ruby -rerb -e 'puts ERB.new(File.read("platform/darwin/skity.podspec.erb")).result' > ./out/skity.podspec
          - name: Upload Assets
            uses: softprops/action-gh-release@v2
            with:
                token: ${{ secrets.GITHUB_TOKEN }}
                files: |
                    out/release/skity.framework-${{ github.event.release.tag_name }}.zip
                    out/skity.podspec
          - name: Publish Podspec to CocoaPods Trunk
            working-directory: platform/darwin
            run: |
              PODSPEC_PATH=$GITHUB_WORKSPACE/out/skity.podspec
              POD_NAME=$(bundle exec ruby -rcocoapods-core -e 'puts Pod::Specification.from_file(ARGV[0]).name' "$PODSPEC_PATH")
              POD_VERSION=$(bundle exec ruby -rcocoapods-core -e 'puts Pod::Specification.from_file(ARGV[0]).version' "$PODSPEC_PATH")
              echo "publishing $POD_NAME $POD_VERSION to the CocoaPods trunk"

              # trunk may accept the push server-side while the client times out
              # polling the commit URL; verify against the trunk API instead of
              # trusting the client exit code
              version_on_trunk() {
                curl -sf --max-time 30 "https://trunk.cocoapods.org/api/v1/pods/${POD_NAME}" \
                  | jq -e --arg v "$POD_VERSION" '.versions[] | select(.name == $v)' > /dev/null
              }

              if version_on_trunk; then
                echo "$POD_NAME $POD_VERSION already exists on trunk, skipping push"
                exit 0
              fi

              for attempt in 1 2 3; do
                echo "::group::pod trunk push attempt ${attempt}"
                if COCOAPODS_TRUNK_TOKEN=${{ secrets.REPO_SKITY_COCOAPODS_TRUNK_TOKEN }} \
                  bundle exec pod trunk push "$PODSPEC_PATH" --allow-warnings --verbose; then
                  echo "::endgroup::"
                  exit 0
                fi
                echo "::endgroup::"
                sleep 60
                if version_on_trunk; then
                  echo "attempt ${attempt} timed out client-side but the version is on trunk; publish succeeded"
                  exit 0
                fi
                echo "attempt ${attempt} failed and the version is not on trunk yet, retrying"
              done

              echo "::error::pod trunk push failed after 3 attempts"
              exit 1
