plugins {
    alias(libs.plugins.android.library)
}

apply from: './publish.gradle'

android {
    namespace 'org.lynxsdk.lynx.skity'
    compileSdk 35

    def osName = System.properties['os.name'].toLowerCase()
    if (osName.contains('mac')) {
        ndkVersion = "24.0.8215888" // needs use 24.0.8215888 or higher on MacOS 26.+ to prevent linking error
    } else {
        ndkVersion = "21.3.6528147"
    }

    defaultConfig {
        if (osName.contains('mac')) {
            minSdk 19 // ndk 24.0.8215888 only support minSdk 19
        } else {
            minSdk 16
        }

        externalNativeBuild {
            cmake {
                // static STL: old NDK's libc++_shared.so is not 16KB aligned
                arguments   "-DANDROID_STL=c++_static",
                            "-DSKITY_EXAMPLE=OFF",
                            "-DSKITY_TEST=OFF",
                            "-DSKITY_LOG=ON",
                            "-DSKITY_VK_BACKEND=ON",
                            "-DSKITY_CODEC_MODULE=ON",
                            "-DSKITY_IO_MODULE=ON",
                            "-DSKITY_CAPI_MODULE=ON",
                            "-DWGX_GLSL_BACKEND=ON",
                            "-DWGX_MSL_BACKEND=OFF",
                            "-DSKITY_BUILD_INSTALL=OFF"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    buildFeatures {
        prefabPublishing true
    }

    prefab {
        skity {
            headers "../../include"
        }
        codec {
            headers "../../module/codec/include/"
            name "skity-codec"
        }

        io {
            headers "../../module/io/include/"
            name "skity-io"
        }

        capi {
            // The include root carries exactly this (normal, legacy-C++)
            // build's surface: the skity/c C ABI plus the skity/hpp/bridge.hpp
            // header. The header-only wrapper lives in a separate include root
            // (module/capi/wrapper/include) and is SKITY_UNIFIED_LIB-only.
            headers "../../module/capi/include/"
            name "skity-capi"
        }
    }
}
