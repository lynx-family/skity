<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Deliberately distinguish language inputs even when TTC faces share a charset. -->
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-Hans</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-Hant</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
</fontconfig>
