<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Multiplication exposes repeated font substitutions; assignment does not. -->
  <match target="font">
    <test name="family"><string>Noto Serif</string></test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <double>2</double><double>0</double>
          <double>0</double><double>1</double>
        </matrix>
      </times>
    </edit>
  </match>
</fontconfig>
