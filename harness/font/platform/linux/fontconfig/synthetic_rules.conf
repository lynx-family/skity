<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font"><test name="family"><string>Noto Serif</string></test><edit name="matrix" mode="assign"><matrix><double>1</double><double>0.25</double><double>0</double><double>1</double></matrix></edit><edit name="fullname" mode="assign"><string>Harness Slanted Serif</string></edit></match>
  <match target="font"><test name="family"><string>Source Sans Pro</string></test><edit name="embolden" mode="assign"><bool>true</bool></edit><edit name="fullname" mode="assign"><string>Harness Emboldened Sans</string></edit></match>
</fontconfig>
